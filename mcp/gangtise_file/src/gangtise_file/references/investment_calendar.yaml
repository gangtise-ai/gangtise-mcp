name: investment_calendar
title: Investment Calendar
description: 检索投资日历：路演、调研、线下策略会、论坛、财报日历；财报日历区分已发布（可下载原文件）与尚未发布（日程预告）。
parameters:
  kind:
    type: string
    description: 投资日历活动类型
    required: true
  keyword:
    type: string
    description: 搜索关键词
  start_date:
    type: string
    description: 起始日期，格式 yyyy-MM-dd
  end_date:
    type: string
    description: 结束日期，格式 yyyy-MM-dd
  limit:
    type: integer
    description: 返回条数上限
  securities:
    type: array
    description: 证券名称或代码列表
    items:
      type: string
  institutions:
    type: array
    description: institutions
    items:
      type: string
  research_areas:
    type: array
    description: research_areas
    items:
      type: string
  category_list:
    type: array
    description: 分类/类型列表；帕米尔专家纪要可选 companyAnalysis/industryAnalysis（或中文：公司分析/行业分析）
    items:
      type: string
  market_list:
    type: array
    description: 市场类别列表；可选 aShares/hkStocks/usChinaConcept/usStocks（或中文：A股/港股/美股中概/美股）
    items:
      type: string
  participant_role_list:
    type: array
    description: participant_role_list
    items:
      type: string
  broker_type_list:
    type: array
    description: broker_type_list
    items:
      type: string
  permission_list:
    type: array
    description: permission_list
    items:
      type: string
  object_list:
    type: array
    description: object_list
    items:
      type: string
  download:
    type: boolean
    description: 是否下载文件全文
