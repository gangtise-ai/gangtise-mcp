name: foreign_opinion
title: Foreign Opinion
description: 检索外资/海外机构观点索引，支持地区、评级、证券与机构等筛选；可选下载。
parameters:
  source:
    type: string
    description: 来源类型列表，如 researchReport、conference、announcement、view
  keyword:
    type: string
    description: 搜索关键词
  securities:
    type: array
    description: 证券名称或代码列表
    items:
      type: string
  start_date:
    type: string
    description: 起始日期，格式 yyyy-MM-dd
  end_date:
    type: string
    description: 结束日期，格式 yyyy-MM-dd
  institutions:
    type: array
    description: institutions
    items:
      type: string
  industries:
    type: array
    description: 行业或研究方向名称列表；可选值见 get_industries
    items:
      type: string
  region_list:
    type: array
    description: region_list
    items:
      type: string
  rating_list:
    type: array
    description: rating_list
    items:
      type: string
  rating_change_list:
    type: array
    description: rating_change_list
    items:
      type: string
  rank_type:
    type: integer
    description: 排序方式：1 综合排序，2 时间倒序
  limit:
    type: integer
    description: 返回条数上限
  download:
    type: boolean
    description: 是否下载文件全文
  download_types:
    type: array
    description: 下载格式列表，如 pdf、markdown；帕米尔专家纪要为 original、html
    items:
      type: string
