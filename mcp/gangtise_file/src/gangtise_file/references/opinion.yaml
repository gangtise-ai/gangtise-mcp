name: opinion
title: Opinion
description: 检索国内机构首席观点（列表仅摘要）；支持券商、首席、题材、投研标签、来源类型等多维筛选；可选 -d 经 getDetail 下载正文。
parameters:
  keyword:
    type: string
    description: 搜索关键词
  securities:
    type: array
    description: 证券名称或代码列表
    items:
      type: string
  start_date:
    type: string
    description: 起始日期，格式 yyyy-MM-dd
  end_date:
    type: string
    description: 结束日期，格式 yyyy-MM-dd
  institutions:
    type: array
    description: institutions
    items:
      type: string
  industries:
    type: array
    description: 行业或研究方向名称列表；可选值见 get_industries
    items:
      type: string
  chiefs:
    type: array
    description: chiefs
    items:
      type: string
  concepts:
    type: array
    description: 题材名称或 ID 列表
    items:
      type: string
  llm_tags:
    type: array
    description: llm_tags
    items:
      type: string
  source_types:
    type: array
    description: source_types
    items:
      type: string
  rank_type:
    type: integer
    description: 排序方式：1 综合排序，2 时间倒序
  limit:
    type: integer
    description: 返回条数上限；开启 download 且未传时默认 5
  download:
    type: boolean
    description: 是否下载观点正文（getDetail，按条计积分）
  download_types:
    type: array
    description: 下载格式，如 txt、md
    items:
      type: string
  output_dir:
    type: string
    description: 结果与下载文件保存目录
