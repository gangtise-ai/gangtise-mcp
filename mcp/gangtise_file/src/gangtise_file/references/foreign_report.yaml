name: foreign_report
title: Foreign Report
description: 检索外资/海外研报索引，支持页数、评级、行业、地区等筛选；可选下载。
parameters:
  keyword:
    type: string
    description: 搜索关键词
  securities:
    type: array
    description: 证券名称或代码列表
    items:
      type: string
  start_date:
    type: string
    description: 起始日期，格式 yyyy-MM-dd
  end_date:
    type: string
    description: 结束日期，格式 yyyy-MM-dd
  institutions:
    type: array
    description: institutions
    items:
      type: string
  industries:
    type: array
    description: 行业或研究方向名称列表；可选值见 get_industries
    items:
      type: string
  region_list:
    type: array
    description: region_list
    items:
      type: string
  category_list:
    type: array
    description: 分类/类型列表；帕米尔专家纪要可选 companyAnalysis/industryAnalysis（或中文：公司分析/行业分析）
    items:
      type: string
  llm_tag_list:
    type: array
    description: llm_tag_list
    items:
      type: string
  rating_list:
    type: array
    description: rating_list
    items:
      type: string
  rating_change_list:
    type: array
    description: rating_change_list
    items:
      type: string
  min_report_pages:
    type: integer
    description: min_report_pages
  max_report_pages:
    type: integer
    description: max_report_pages
  search_type:
    type: integer
    description: 搜索类型：1 标题搜索，2 全文搜索
  rank_type:
    type: integer
    description: 排序方式：1 综合排序，2 时间倒序
  limit:
    type: integer
    description: 返回条数上限
  download:
    type: boolean
    description: 是否下载文件全文
  download_types:
    type: array
    description: 下载格式列表，如 pdf、markdown；帕米尔专家纪要为 original、html
    items:
      type: string
