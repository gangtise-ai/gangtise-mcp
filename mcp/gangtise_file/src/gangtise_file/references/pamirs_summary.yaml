name: pamirs_summary
title: Pamirs Summary
description: 检索帕米尔牵头机构下的专家纪要，支持关键词、证券、研究方向、类别、市场筛选；可选下载原始文件或 HTML。需已购买专家纪要数据库权限。
parameters:
  keyword:
    type: string
    description: 搜索关键词
  securities:
    type: array
    description: 证券名称或代码列表
    items:
      type: string
  start_date:
    type: string
    description: 起始日期，格式 yyyy-MM-dd
  end_date:
    type: string
    description: 结束日期，格式 yyyy-MM-dd
  industries:
    type: array
    description: 行业或研究方向名称列表；可选值见 get_industries
    items:
      type: string
  market_list:
    type: array
    description: 市场类别列表；可选 aShares/hkStocks/usChinaConcept/usStocks（或中文：A股/港股/美股中概/美股）
    items:
      type: string
  category_list:
    type: array
    description: 分类/类型列表；帕米尔专家纪要可选 companyAnalysis/industryAnalysis（或中文：公司分析/行业分析）
    items:
      type: string
  search_type:
    type: integer
    description: 搜索类型：1 标题搜索，2 全文搜索
  rank_type:
    type: integer
    description: 排序方式：1 综合排序，2 时间倒序
  limit:
    type: integer
    description: 返回条数上限
  download:
    type: boolean
    description: 是否下载文件全文
  download_types:
    type: array
    description: 下载格式列表，如 pdf、markdown；帕米尔专家纪要为 original、html
    items:
      type: string
