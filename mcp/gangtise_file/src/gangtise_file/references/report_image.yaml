name: report_image
title: Report Image
description: 按关键词搜索研报中的图片，返回图注、页码、页面内容描述及 chunkId；支持时间范围、研报 ID 过滤。
parameters:
  keyword:
    type: string
    description: 搜索关键词
    required: true
  start_date:
    type: string
    description: 起始日期，格式 yyyy-MM-dd
  end_date:
    type: string
    description: 结束日期，格式 yyyy-MM-dd
  source_id:
    type: string
    description: source_id
  limit:
    type: integer
    description: 返回条数上限
  download:
    type: boolean
    description: 是否下载文件全文
