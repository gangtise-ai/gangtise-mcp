name: announcement
title: Announcement
description: 检索 A 股/港股公告索引，可按证券、日期、公告类型筛选；可选下载全文。
parameters:
  keyword:
    type: string
    description: 搜索关键词
  securities:
    type: array
    description: 证券名称或代码列表
    items:
      type: string
  start_date:
    type: string
    description: 起始日期，格式 yyyy-MM-dd
  end_date:
    type: string
    description: 结束日期，格式 yyyy-MM-dd
  category_list:
    type: array
    description: 分类/类型列表；帕米尔专家纪要可选 companyAnalysis/industryAnalysis（或中文：公司分析/行业分析）
    items:
      type: string
  search_type:
    type: integer
    description: 搜索类型：1 标题搜索，2 全文搜索
  rank_type:
    type: integer
    description: 排序方式：1 综合排序，2 时间倒序
  limit:
    type: integer
    description: 返回条数上限
  download:
    type: boolean
    description: 是否下载文件全文
  download_types:
    type: array
    description: 下载格式列表，如 pdf、markdown；帕米尔专家纪要为 original、html
    items:
      type: string
