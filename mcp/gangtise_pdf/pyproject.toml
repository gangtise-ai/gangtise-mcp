[project]
name = "gangtise-pdf-mcp"
version = "0.1.0"
description = "Gangtise MCP Server (gangtise_pdf): PDF high-precision parse (submit/result)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gangtise" }]
dependencies = [
    "mcp>=1.0.0,<2",
    "requests>=2.32.5",
    "pyyaml>=6.0",
    "pypdf>=4.0.0",
]

[project.scripts]
gangtise-pdf-mcp = "pdf_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml", "README.md", "LICENSE"]
